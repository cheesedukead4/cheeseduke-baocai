<h1>隱私權政策</h1>
<p>「檔期包材管理系統」是公司內部使用的包材與庫存管理工具，只供管理員加入名單的同事使用。</p>
<h2>我們取得的資料</h2>
<p>使用 Google 登入時，只會取得你的 Google 帳號電子郵件地址與顯示名稱，不會取得你的密碼、聯絡人、雲端硬碟或其他 Google 資料。</p>
<h2>使用目的</h2>
<p>電子郵件地址僅用來確認你是否在管理員設定的人員名單內，以及記錄資料是由誰修改的；顯示名稱僅用於畫面顯示。</p>
<h2>保存與分享</h2>
<p>這些資料只存放在公司管理員的 Google Apps Script 專案中，不會出售、出租或提供給第三方。管理員可隨時從名單中刪除你的資料。</p>
<h2>聯絡方式</h2>
<p>如有疑問，請聯絡公司管理員。</p>
</body></html>
